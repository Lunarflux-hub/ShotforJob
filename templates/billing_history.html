{% extends "base.html" %}
{% load static %}

{% block title %}История платежей — ShotForJob{% endblock %}

{% block extra_css %}
<style>
    .history-wrap { max-width: 900px; margin: 0 auto 80px; padding: 20px 0 80px; }
    .history-title { font-size: 32px; font-weight: 700; margin-bottom: 24px; }
    .history-card { background: #fff; border-radius: 20px; overflow: hidden; }
    .history-empty { padding: 48px 32px; text-align: center; opacity: 0.6; }

    .history-row {
        display: grid;
        grid-template-columns: 1.3fr 1fr 0.8fr 0.9fr 0.9fr;
        gap: 12px;
        padding: 16px 24px;
        align-items: center;
        border-bottom: 1px solid #efefef;
        font-size: 14px;
    }
    .history-row:last-child { border-bottom: none; }
    .history-row.head { font-size: 12px; text-transform: uppercase; opacity: 0.5; letter-spacing: 0.04em; }
    .history-row .mono { font-family: monospace; }
    .history-status {
        display: inline-block; padding: 4px 10px; border-radius: 20px;
        font-size: 12px; font-weight: 600;
    }
    .history-status.paid { background: #e3f5e6; color: #1a8a34; }
    .history-status.pending { background: #fff4e5; color: #b06a00; }
    .history-status.failed, .history-status.expired { background: #ffe5e5; color: #c0281f; }

    .history-row .amount { font-weight: 700; }
    .history-receipt-link { color: #0066FF; text-decoration: none; font-weight: 600; }

    @media (max-width: 720px) {
        .history-row { grid-template-columns: 1fr 1fr; row-gap: 6px; }
        .history-row.head { display: none; }
    }
</style>
{% endblock %}

{% block content %}
<div class="history-wrap">
    <div class="history-title">История платежей</div>
    <div class="history-card">
        <div class="history-row head">
            <div>Дата</div>
            <div>Пакет</div>
            <div>Сумма</div>
            <div>Статус</div>
            <div>Чек</div>
        </div>
        <div id="historyList"></div>
        <div id="historyEmpty" class="history-empty" style="display:none;">Платежей пока нет.</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/billing_history.js' %}"></script>
{% endblock %}
