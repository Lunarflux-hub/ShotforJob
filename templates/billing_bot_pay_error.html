<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Оплата — ShotForJob</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f6fa;
        color: #1a1a1a;
    }
    .box {
        background: #ffffff;
        border-radius: 20px;
        padding: 32px 28px;
        max-width: 360px;
        width: calc(100% - 32px);
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    p { line-height: 1.5; }
</style>
</head>
<body>
    <div class="box">
        <p>{{ message }}</p>
    </div>
</body>
</html>
