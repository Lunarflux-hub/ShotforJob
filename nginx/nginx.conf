server {
    listen 80;
    server_name shotforjob.com www.shotforjob.com;
    server_tokens off;

    # Перенаправляем HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Для обновления сертификатов
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name shotforjob.com www.shotforjob.com;

    ssl_certificate /etc/letsencrypt/live/shotforjob.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shotforjob.com/privkey.pem;

    client_max_body_size 20M;  # чуть больше MAX_UPLOAD_SIZE_MB с запасом

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Django шлёт X-Frame-Options: DENY на каждой странице (см.
        # XFrameOptionsMiddleware в config/settings.py) — это ломает
        # воспроизведение записей в Яндекс.Вебвизоре, ему нужно открывать
        # страницы сайта во фрейме. Убираем DENY и вместо этого разрешаем
        # фреймы только с доменов Яндекса через CSP frame-ancestors —
        # современные браузеры используют её вместо X-Frame-Options, старые
        # браузеры остаются защищены через SAMEORIGIN.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://webvisor.com https://*.yandex.ru https://*.yandex.net https://*.yandex.com;" always;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
