server {
    listen 80;
    server_name server_name shotforjob.com www.shotforjob.com;  # замените на ваш домен: shotforjob.ru www.shotforjob.ru

    client_max_body_size 20M;  # чуть больше MAX_UPLOAD_SIZE_MB с запасом

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
